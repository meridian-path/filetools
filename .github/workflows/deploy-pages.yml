name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one run per ref at a time; a new push to that same ref cancels its
# own in-flight run rather than queueing behind it, since only the latest
# commit's build should ever ship. Keyed per-ref (not a bare "pages" group)
# so this never cancels a DIFFERENT branch's or PR's in-flight run - a bare
# shared group meant pushing to any one open PR could cancel another PR's
# still-running build check, or a master push (merge) could cancel a
# still-running PR check elsewhere in the repo, entirely unrelated to that
# PR's own commits. That's a real, reproduced mechanism, not a hypothetical:
# it can make a PR's "checks passed" status reflect a stale, superseded
# commit rather than its actual current head, which is a plausible
# contributor to this repo's recurring PR-merged-at-a-stale-commit
# incidents.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vendor client-side libraries
        run: npm run vendor

      - name: Build site
        run: npm run build

      # The end-to-end tests drive a real headless Chromium via Playwright.
      # npm ci does not download browser binaries on its own -- without this,
      # every e2e test fails fast with "Executable doesn't exist" and the
      # test runner then hangs rather than exiting, burning CI minutes until
      # the job times out. Cached the same way as lichess-stats-poc's
      # workflow.
      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./node_modules/playwright/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Requires dist/ to already exist -- the end-to-end tests exercise the
      # built site itself, not just source. See TESTING.md section 5.
      - name: Run test suite
        run: npm test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # IndexNow (Bing/Yandex/Naver/Seznam/Yep instant-index ping) -- self-
      # service, no account/API key/ToS (indexnow.org/documentation). Only
      # runs here (the real-deploy job, gated on push to master), never in
      # `build`, so a PR run never submits production URLs to a live
      # third-party service for content that PR hasn't actually deployed.
      # scripts/indexnow-ping.js requires only src/ (fs/path, no npm
      # packages), so no `npm ci` is needed for this one script -- checkout
      # + Node is enough. Never fails this job on a bad response -- see
      # that script's own header comment.
      - name: Checkout (for the IndexNow ping script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js (for the IndexNow ping script)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Ping IndexNow
        run: node scripts/indexnow-ping.js
