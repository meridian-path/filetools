# Blocks merge (once wired into branch protection -- a repo-settings step a
# human completes separately) on any PR carrying the "copy-review-required"
# label without a matching "copy-review-resolved" label. Detection is
# label-based (an exact-match GitHub primitive), not a free-text grep over
# the PR body/commits -- a prior version grepped for the literal string
# "COPY-REVIEW: REQUIRED" and a paraphrase of that requirement silently
# bypassed it (the gate correctly caught the exact marker on one PR, then
# missed a semantically-identical paraphrase on the next). The PR body may
# still carry the human-readable "COPY-REVIEW: REQUIRED"/"COPY-REVIEW:
# RESOLVED" text as a convention for anyone reading the PR, but that text is
# no longer this gate's actual input. Uses the GitHub CLI (gh), preinstalled
# and pre-authenticated with GITHUB_TOKEN on GitHub-hosted runners -- no
# third-party Action is needed here, so there is nothing that needs pinning
# to a commit SHA the way the deploy workflow's third-party Actions are.
name: Copy Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  copy-review-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check for an unresolved copy-review-required label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels -q '.labels[].name' || echo "")

          NEEDS_REVIEW=false
          if grep -qx "copy-review-required" <<< "$LABELS"; then
            NEEDS_REVIEW=true
          fi

          RESOLVED=false
          if grep -qx "copy-review-resolved" <<< "$LABELS"; then
            RESOLVED=true
          fi

          if [ "$NEEDS_REVIEW" = "true" ] && [ "$RESOLVED" != "true" ]; then
            echo "::error::This PR carries the 'copy-review-required' label without a matching 'copy-review-resolved' label. An independent reviewer must add the 'copy-review-resolved' label after checking the copy diff before this can merge."
            exit 1
          fi

          echo "Copy review gate: no unresolved copy-review-required label found."
